    <script>
      // Global error shield to prevent third-party cross-origin scripts (e.g. TradingView embed) or HMR WebSocket from triggering noisy overlays
      (function() {
        function shouldSuppress(msg, source, err) {
          if (!msg) msg = '';
          var m = String(msg).toLowerCase();
          var s = String(source || (err && (err.stack || err.message)) || '').toLowerCase();
          if (m.indexOf('script error') !== -1) return true;
          if (m.indexOf('contentwindow') !== -1) return true;
          if (m.indexOf('cannot listen to the event') !== -1) return true;
          if (m.indexOf('tradingview') !== -1) return true;
          if (m.indexOf('websocket') !== -1) return true;
          if (m.indexOf('closed without opened') !== -1) return true;
          if (m.indexOf('vite:ws') !== -1) return true;
          if (s.indexOf('@vite/client') !== -1) return true;
          if (s && s.indexOf(window.location.host) === -1 && s.indexOf('localhost') === -1) return true;
          return false;
        }

        window.onerror = function(message, source, lineno, colno, error) {
          if (shouldSuppress(message, source, error)) {
            return true;
          }
        };

        window.addEventListener('error', function(e) {
          if (!e) return;
          var msg = e.message || (e.error && e.error.message) || '';
          var src = e.filename || '';
          if (shouldSuppress(msg, src, e.error)) {
            e.preventDefault && e.preventDefault();
            e.stopPropagation && e.stopPropagation();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (!e) return;
          var reasonStr = String((e.reason && (e.reason.message || e.reason.stack || e.reason)) || '');
          var stack = String((e.reason && e.reason.stack) || '');
          if (shouldSuppress(reasonStr, stack, e.reason)) {
            e.preventDefault && e.preventDefault();
            e.stopPropagation && e.stopPropagation();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);

        // Shim HTMLIFrameElement.prototype.contentWindow to prevent TradingView embed widget from throwing when browsing context is in transition
        try {
          var desc = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'contentWindow');
          if (desc && desc.get) {
            var origGet = desc.get;
            Object.defineProperty(HTMLIFrameElement.prototype, 'contentWindow', {
              get: function() {
                var win = origGet.call(this);
                if (win) return win;
                try {
                  var src = this.getAttribute('src') || '';
                  var id = this.getAttribute('id') || '';
                  var cls = this.className || '';
                  if (src.indexOf('tradingview') !== -1 || id.indexOf('tradingview') !== -1 || cls.indexOf('tradingview') !== -1 || (this.closest && this.closest('.tradingview-widget-container'))) {
                    return {
                      addEventListener: function() {},
                      removeEventListener: function() {},
                      postMessage: function() {},
                      location: { href: '' }
                    };
                  }
                } catch (_) {}
                return win;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}
      })();
    </script>
